[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-studio-3d"
version = "0.1.0"
description = "Open 2.5D depth-camera renderer and editor interchange tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
parallax3d = "parallax3d.cli:main"

[tool.setuptools.packages.find]
include = ["parallax3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
